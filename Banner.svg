<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b3b">
        <animate attributeName="offset" values="-0.3;1;-0.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff8a3b">
        <animate attributeName="offset" values="0.2;1.5;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff3b3b">
        <animate attributeName="offset" values="0.7;2;0.7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#ff8a3b"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="4" y="4" width="892" height="232" rx="12"/>
    </clipPath>
  </defs>

  <!-- outer glowing border -->
  <rect x="0" y="0" width="900" height="240" rx="14" fill="url(#borderGlow)"/>
  <rect x="3" y="3" width="894" height="234" rx="12" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- moving scanline -->
    <rect x="0" y="-20" width="900" height="20" fill="#3fb950" opacity="0.06">
      <animate attributeName="y" values="-20;240" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- faint grid lines -->
    <g stroke="#1c2733" stroke-width="1">
      <line x1="0" y1="60" x2="900" y2="60"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="180" x2="900" y2="180"/>
    </g>

    <!-- title bar dots -->
    <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="26" r="6" fill="#27c93f">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="31" fill="#8b949e" font-size="13">rxvy@recon:~$</text>

    <!-- title -->
    <text x="60" y="105" font-size="48" font-weight="bold" fill="url(#accent)" filter="url(#glow)">
      ⚡ rxvy-recon
    </text>
    <text x="60" y="135" font-size="16" fill="#8b949e">
      Recon &amp; OSINT toolkit launcher, wrapped in ProxyChains
    </text>

    <!-- typed command line -->
    <text x="60" y="175" font-size="15" fill="#58a6ff">Choose:</text>
    <text x="132" y="175" font-size="15" fill="#e6edf3">
      <tspan id="typed">1</tspan>
    </text>
    <rect x="150" y="163" width="9" height="16" fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="205" font-size="13" fill="#6e7681">
      Nmap · Nikto · WHOIS · DIRB · Subfinder · Sherlock · Holehe · SQLMap · WPScan
    </text>

    <!-- side accent -->
    <rect x="0" y="0" width="6" height="240" fill="url(#accent)"/>
  </g>
</svg>
