<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="50%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#8b0000">
        <animate attributeName="stop-color" values="#8b0000;#ff1a1a;#8b0000" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#4a1010"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="vignette" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4d0000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="4" y="4" width="892" height="252" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="14" fill="url(#borderGlow)"/>
  <rect x="3" y="3" width="894" height="254" rx="12" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="900" height="260" fill="url(#vignette)"/>

    <!-- drifting scanline -->
    <rect x="0" y="-24" width="900" height="24" fill="#ff1a1a" opacity="0.07">
      <animate attributeName="y" values="-24;260" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- horizon lines -->
    <line x1="0" y1="70" x2="900" y2="70" stroke="#3a1414" stroke-width="1"/>
    <line x1="0" y1="205" x2="900" y2="205" stroke="#3a1414" stroke-width="1"/>

    <!-- eyebrow -->
    <text x="60" y="45" font-size="13" fill="#a34747" letter-spacing="4">
      OFFENSIVE SECURITY · RECON · OSINT
    </text>

    <!-- bolt icon, pulsing -->
    <path d="M 68 80 L 50 110 L 63 110 L 55 134 L 80 100 L 66 100 Z"
          fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- title with glitch-flicker -->
    <text x="94" y="114" font-size="56" font-weight="bold" fill="url(#accent)" filter="url(#glow)" letter-spacing="1">
      RXVY-RECON
      <animate attributeName="fill-opacity" values="1;1;0.85;1;1" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- underline, growing pulse -->
    <rect x="94" y="128" width="380" height="3" fill="url(#accent)" filter="url(#softGlow)">
      <animate attributeName="width" values="380;420;380" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="60" y="165" font-size="17" fill="#e6c9c9">
      One menu. Every recon tool you need. Zero flag-memorizing.
    </text>

    <!-- capability chips, all red family -->
    <g font-size="13" font-weight="bold">
      <rect x="60" y="180" width="94" height="26" rx="13" fill="#ff1a1a"/>
      <text x="78" y="197" fill="#1a0000">14 TOOLS</text>

      <rect x="164" y="180" width="128" height="26" rx="13" fill="#c81e1e"/>
      <text x="180" y="197" fill="#1a0000">PROXYCHAINS</text>

      <rect x="302" y="180" width="98" height="26" rx="13" fill="#8b0000" stroke="#ff4d4d" stroke-width="1"/>
      <text x="317" y="197" fill="#f5c6c6">TOR + VPN</text>

      <rect x="410" y="180" width="118" height="26" rx="13" fill="#ff1a1a">
        <animate attributeName="fill" values="#ff1a1a;#ff5c5c;#ff1a1a" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="424" y="197" fill="#1a0000">ONE COMMAND</text>
    </g>

    <text x="60" y="235" font-size="12" fill="#7a3a3a">
      Nmap · Nikto · WHOIS · DIRB · Subfinder · Sherlock · Holehe · SQLMap · WPScan
    </text>

    <rect x="0" y="0" width="6" height="260" fill="url(#accent)"/>
  </g>
</svg>
