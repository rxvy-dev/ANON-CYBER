<svg viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="50%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#8b0000">
        <animate attributeName="stop-color" values="#8b0000;#ff1a1a;#8b0000" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#4a1010"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="vignette" cx="30%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#4d0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="4" y="4" width="892" height="1492" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="1500" rx="14" fill="url(#borderGlow)"/>
  <rect x="3" y="3" width="894" height="1494" rx="12" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="900" height="1500" fill="url(#vignette)"/>
    <rect x="0" y="-24" width="900" height="24" fill="#ff1a1a" opacity="0.06">
      <animate attributeName="y" values="-24;1500" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ HEADER ============ -->
    <text x="60" y="55" font-size="13" fill="#a34747" letter-spacing="4">OFFENSIVE SECURITY · RECON · OSINT</text>

    <path d="M 68 90 L 50 120 L 63 120 L 55 144 L 80 110 L 66 110 Z" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="94" y="124" font-size="56" font-weight="bold" fill="url(#accent)" filter="url(#glow)" letter-spacing="1">RXVY-RECON</text>
    <rect x="94" y="138" width="380" height="3" fill="url(#accent)" filter="url(#softGlow)">
      <animate attributeName="width" values="380;420;380" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="175" font-size="17" fill="#e6c9c9">One menu. Every recon tool you need. Zero flag-memorizing.</text>
    <text x="60" y="198" font-size="13" fill="#7a3a3a">Created by rxvy · Version 3.0 · Open Source</text>

    <g font-size="13" font-weight="bold">
      <rect x="60" y="212" width="94" height="26" rx="13" fill="#ff1a1a"/><text x="78" y="229" fill="#1a0000">14 TOOLS</text>
      <rect x="164" y="212" width="128" height="26" rx="13" fill="#c81e1e"/><text x="180" y="229" fill="#1a0000">PROXYCHAINS</text>
      <rect x="302" y="212" width="98" height="26" rx="13" fill="#8b0000" stroke="#ff4d4d" stroke-width="1"/><text x="317" y="229" fill="#f5c6c6">TOR + VPN</text>
      <rect x="410" y="212" width="118" height="26" rx="13" fill="#ff1a1a">
        <animate attributeName="fill" values="#ff1a1a;#ff5c5c;#ff1a1a" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="424" y="229" fill="#1a0000">ONE COMMAND</text>
    </g>

    <line x1="60" y1="270" x2="840" y2="270" stroke="#3a1414" stroke-width="1"/>

    <!-- ============ OVERVIEW ============ -->
    <text x="60" y="310" font-size="22" font-weight="bold" fill="#ff4d4d" letter-spacing="2">OVERVIEW</text>
    <text x="60" y="340" font-size="14" fill="#d9b8b8">rxvy-recon wraps well-known recon, OSINT, and</text>
    <text x="60" y="360" font-size="14" fill="#d9b8b8">security-testing tools behind one fast terminal menu.</text>
    <text x="60" y="380" font-size="14" fill="#d9b8b8">Traffic routes through ProxyChains by default, and every</text>
    <text x="60" y="400" font-size="14" fill="#d9b8b8">tool is one number-and-target away — no flags to memorize.</text>
    <text x="60" y="425" font-size="13" fill="#a34747">Built for CTFs, homelabs, and authorized pentest engagements.</text>

    <line x1="60" y1="460" x2="840" y2="460" stroke="#3a1414" stroke-width="1"/>

    <!-- ============ TOOLS ============ -->
    <text x="60" y="500" font-size="22" font-weight="bold" fill="#ff4d4d" letter-spacing="2">INCLUDED TOOLS</text>

    <text x="60" y="535" font-size="13" fill="#ff8080" letter-spacing="2">RECON &amp; SCANNING</text>
    <text x="60" y="558" font-size="14" fill="#e6c9c9">- Nmap — network / port scanning</text>
    <text x="60" y="580" font-size="14" fill="#e6c9c9">- Nmap -O — OS detection (sudo)</text>
    <text x="60" y="602" font-size="14" fill="#e6c9c9">- Nikto — web server security scan</text>
    <text x="60" y="624" font-size="14" fill="#e6c9c9">- DIRB — web directory enumeration</text>
    <text x="60" y="646" font-size="14" fill="#e6c9c9">- Subfinder — passive subdomain discovery</text>
    <text x="60" y="668" font-size="14" fill="#e6c9c9">- FTP / WHOIS — connections &amp; domain lookups</text>

    <text x="480" y="535" font-size="13" fill="#ff8080" letter-spacing="2">OSINT &amp; VULN</text>
    <text x="480" y="558" font-size="14" fill="#e6c9c9">- Holehe — email exposure checks</text>
    <text x="480" y="580" font-size="14" fill="#e6c9c9">- Sherlock — username OSINT</text>
    <text x="480" y="602" font-size="14" fill="#e6c9c9">- ZPhisher — phishing simulation</text>
    <text x="480" y="624" font-size="14" fill="#e6c9c9">- SQLMap — SQL injection testing</text>
    <text x="480" y="646" font-size="14" fill="#e6c9c9">- WPScan — WordPress security scan</text>
    <text x="480" y="668" font-size="14" fill="#e6c9c9">- Tor / VPN — Mullvad, Proton, Riseup</text>

    <line x1="60" y1="700" x2="840" y2="700" stroke="#3a1414" stroke-width="1"/>

    <!-- ============ IN ACTION ============ -->
    <text x="60" y="740" font-size="22" font-weight="bold" fill="#ff4d4d" letter-spacing="2">IN ACTION</text>
    <rect x="60" y="760" width="780" height="260" rx="8" fill="#150808" stroke="#3a1414" stroke-width="1"/>
    <image href="./image3.png" x="70" y="770" width="760" height="240" preserveAspectRatio="xMidYMid meet"/>

    <line x1="60" y1="1050" x2="840" y2="1050" stroke="#3a1414" stroke-width="1"/>

    <!-- ============ USAGE ============ -->
    <text x="60" y="1090" font-size="22" font-weight="bold" fill="#ff4d4d" letter-spacing="2">USAGE</text>
    <rect x="60" y="1105" width="780" height="90" rx="8" fill="#150808" stroke="#3a1414" stroke-width="1"/>
    <text x="80" y="1135" font-size="14" fill="#3fb950">$ python3 rxvyrecon.py</text>
    <text x="80" y="1160" font-size="13" fill="#a34747">Choose: 1</text>
    <text x="80" y="1180" font-size="13" fill="#a34747">ip or url: scanme.nmap.org</text>

    <line x1="60" y1="1230" x2="840" y2="1230" stroke="#3a1414" stroke-width="1"/>

    <!-- ============ LEGAL ============ -->
    <text x="60" y="1270" font-size="22" font-weight="bold" fill="#ff4d4d" letter-spacing="2">LEGAL &amp; ETHICAL USE</text>
    <text x="60" y="1300" font-size="13" fill="#a34747">Educational use, CTFs, security research, and authorized</text>
    <text x="60" y="1320" font-size="13" fill="#a34747">testing only. Only run these tools against systems you own</text>
    <text x="60" y="1340" font-size="13" fill="#a34747">or have explicit permission to test. Unauthorized scanning</text>
    <text x="60" y="1360" font-size="13" fill="#a34747">is illegal in most jurisdictions. The author is not</text>
    <text x="60" y="1380" font-size="13" fill="#a34747">responsible for any misuse of this software.</text>

    <text x="60" y="1440" font-size="13" fill="#e6c9c9">[*] Star the repo if rxvy-recon is useful to your workflow.</text>

    <rect x="0" y="0" width="6" height="1500" fill="url(#accent)"/>
  </g>
</svg>
