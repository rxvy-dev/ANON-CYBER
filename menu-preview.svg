<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas','SFMono-Regular',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- window -->
  <rect x="20" y="20" width="860" height="660" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="20" y="20" width="860" height="42" rx="14" fill="#161b22"/>
  <rect x="20" y="48" width="860" height="14" fill="#161b22"/>
  <circle cx="46" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="90" cy="41" r="6.5" fill="#27c93f"/>
  <text x="450" y="46" text-anchor="middle" fill="#8b949e" font-size="13">rxvyrecon.py — zsh</text>

  <!-- prompt line -->
  <text x="52" y="90" font-size="14" fill="#6e7681">rxvy@blackarch</text>
  <text x="182" y="90" font-size="14" fill="#ff8a8a">~/rxvy-recon</text>
  <text x="290" y="90" font-size="14" fill="#8b949e">$ python3 rxvyrecon.py</text>

  <!-- title -->
  <text x="450" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#ff5f56" letter-spacing="2">RXVY-RECON v3.0</text>
  <line x1="60" y1="146" x2="840" y2="146" stroke="#30363d" stroke-width="2"/>

  <!-- accent rail -->
  <rect x="52" y="168" width="3" height="440" fill="#ff5f56" opacity="0.55"/>

  <!-- menu rows: [num] tool ...... desc -->
  <g font-size="15">
    <!-- row template y positions -->
    <!-- Network group -->
    <text x="72"  y="180" fill="#ff8a8a" font-weight="600">[1]</text>
    <text x="130" y="180" fill="#e6edf3">Nmap</text>
    <text x="360" y="180" fill="#8b949e">Scan for open ports</text>

    <text x="72"  y="210" fill="#ff8a8a" font-weight="600">[2]</text>
    <text x="130" y="210" fill="#e6edf3">Nikto</text>
    <text x="360" y="210" fill="#8b949e">Web server security scanner</text>

    <text x="72"  y="240" fill="#ff8a8a" font-weight="600">[3]</text>
    <text x="130" y="240" fill="#e6edf3">WHOIS</text>
    <text x="360" y="240" fill="#8b949e">Domain / IP registration info</text>

    <text x="72"  y="270" fill="#ff8a8a" font-weight="600">[4]</text>
    <text x="130" y="270" fill="#e6edf3">FTP</text>
    <text x="360" y="270" fill="#8b949e">Connect to FTP servers</text>

    <text x="72"  y="300" fill="#ff8a8a" font-weight="600">[5]</text>
    <text x="130" y="300" fill="#e6edf3">DIRB</text>
    <text x="360" y="300" fill="#8b949e">Web directory enumeration</text>

    <text x="72"  y="330" fill="#ff8a8a" font-weight="600">[6]</text>
    <text x="130" y="330" fill="#e6edf3">Subfinder</text>
    <text x="360" y="330" fill="#8b949e">Passive subdomain discovery</text>

    <text x="72"  y="360" fill="#ff8a8a" font-weight="600">[7]</text>
    <text x="130" y="360" fill="#e6edf3">Nmap -O</text>
    <text x="360" y="360" fill="#8b949e">Operating-system detection</text>

    <!-- divider -->
    <line x1="72" y1="382" x2="828" y2="382" stroke="#21262d" stroke-width="1"/>

    <!-- Privacy group -->
    <text x="72"  y="410" fill="#ff8a8a" font-weight="600">[8]</text>
    <text x="130" y="410" fill="#e6edf3">Tor</text>
    <text x="360" y="410" fill="#8b949e">Tor service / proxy management</text>

    <text x="72"  y="440" fill="#ff8a8a" font-weight="600">[9]</text>
    <text x="130" y="440" fill="#e6edf3">VPN Manager</text>
    <text x="360" y="440" fill="#8b949e">Install and manage VPN options</text>

    <line x1="72" y1="462" x2="828" y2="462" stroke="#21262d" stroke-width="1"/>

    <!-- OSINT / social group -->
    <text x="66"  y="490" fill="#ff5f56" font-weight="600">[10]</text>
    <text x="130" y="490" fill="#e6edf3">Holehe</text>
    <text x="360" y="490" fill="#8b949e">Check email account exposure</text>

    <text x="66"  y="520" fill="#ff5f56" font-weight="600">[11]</text>
    <text x="130" y="520" fill="#e6edf3">ZPhisher</text>
    <text x="360" y="520" fill="#8b949e">Phishing simulation tool</text>

    <text x="66"  y="550" fill="#ff5f56" font-weight="600">[12]</text>
    <text x="130" y="550" fill="#e6edf3">Sherlock</text>
    <text x="360" y="550" fill="#8b949e">Username OSINT</text>

    <line x1="72" y1="572" x2="828" y2="572" stroke="#21262d" stroke-width="1"/>

    <!-- Web group -->
    <text x="66"  y="600" fill="#ffb3b3" font-weight="600">[13]</text>
    <text x="130" y="600" fill="#e6edf3">SQLMap</text>
    <text x="360" y="600" fill="#8b949e">SQL injection testing</text>

    <text x="66"  y="630" fill="#ffb3b3" font-weight="600">[14]</text>
    <text x="130" y="630" fill="#e6edf3">WPScan</text>
    <text x="360" y="630" fill="#8b949e">WordPress security scanner</text>
  </g>

  <!-- bottom bar -->
  <rect x="52" y="650" width="788" height="1" fill="#30363d"/>
  <text x="72" y="675" font-size="14" fill="#ffb3b3" font-weight="600">[I] Install Dependencies</text>
  <text x="700" y="675" font-size="14" fill="#ff5f56" font-weight="600">[Q] Exit</text>
</svg>
