<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rxvy-recon banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>rxvy-recon — one menu, every recon tool</title>
  <defs>
    <radialGradient id="glow-bg" cx="30%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3a0f0f" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#1a0a09" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0a09" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#241715" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-title">
      <rect x="70" y="65" width="0" height="100">
        <animate id="typeTitle" attributeName="width" from="0" to="520" dur="0.9s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clip-cmd">
      <rect x="90" y="205" width="0" height="30">
        <animate id="typeCmd" attributeName="width" from="0" to="250" dur="0.8s" begin="typeTitle.end+0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="300" fill="#0b0a09"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#glow-bg)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#vignette)"/>

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="40" fill="#121010"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#241a17" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#463430"/>
  <circle cx="42" cy="20" r="6" fill="#463430"/>
  <circle cx="60" cy="20" r="6" fill="#463430"/>
  <text x="90" y="25" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8a8078">rxvy@recon:~$</text>
  <circle cx="1150" cy="20" r="4" fill="#ff1a1a">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1138" y="25" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8a8078">proxychains</text>
  <rect x="0" y="0" width="1200" height="3" fill="#ff1a1a" opacity="0.9"/>

  <!-- radar / reticle -->
  <g opacity="0.9">
    <circle cx="980" cy="150" r="90" fill="none" stroke="#ff1a1a" stroke-width="1.2" opacity="0.18"/>
    <circle cx="980" cy="150" r="60" fill="none" stroke="#ff1a1a" stroke-width="1.2" opacity="0.18"/>
    <circle cx="980" cy="150" r="30" fill="none" stroke="#ff1a1a" stroke-width="1.2" opacity="0.18"/>
    <line x1="980" y1="60" x2="980" y2="240" stroke="#ff1a1a" stroke-width="1" opacity="0.15"/>
    <line x1="890" y1="150" x2="1070" y2="150" stroke="#ff1a1a" stroke-width="1" opacity="0.15"/>
    <circle cx="980" cy="150" r="3" fill="#ff1a1a" opacity="0.5"/>
    <g>
      <line x1="980" y1="150" x2="980" y2="62" stroke="#ff1a1a" stroke-width="2" opacity="0.55"/>
      <circle cx="980" cy="62" r="3" fill="#ff1a1a" opacity="0.85"/>
      <animateTransform attributeName="transform" type="rotate" from="0 980 150" to="360 980 150" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- wordmark (typewriter reveal) -->
  <g clip-path="url(#clip-title)">
    <text x="70" y="140" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="82" font-weight="800" fill="#f3ede6">rxvy-recon</text>
  </g>
  <rect x="612" y="73" width="34" height="80" rx="3" fill="#ff1a1a" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="typeTitle.end" fill="freeze"/>
  </rect>

  <!-- tagline -->
  <text x="72" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" fill="#a89e93" opacity="0">
    One menu. Every recon tool you need. Zero flag-memorizing.
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="typeTitle.end" fill="freeze"/>
  </text>

  <!-- prompt line (typewriter reveal) -->
  <text x="70" y="224" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#ff1a1a" opacity="0">$
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="typeTitle.end+0.3s" fill="freeze"/>
  </text>
  <g clip-path="url(#clip-cmd)">
    <text x="90" y="224" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" fill="#6b625a">python3 rxvyrecon.py</text>
  </g>
  <rect x="346" y="210" width="9" height="18" fill="#ff1a1a" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" begin="typeCmd.end" repeatCount="indefinite"/>
  </rect>

  <!-- bottom menu strip -->
  <line x1="0" y1="258" x2="1200" y2="258" stroke="#241a17" stroke-width="1"/>

  <rect x="62" y="266" width="106" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="228" y="266" width="136" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="424" y="266" width="136" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="4.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="620" y="266" width="156" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="5.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="836" y="266" width="136" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="6.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1032" y="266" width="106" height="24" rx="4" fill="#241012" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="6s" begin="7.6s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[1] Nmap</text>
  <text x="236" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[7] Nmap -O</text>
  <text x="432" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[10] Holehe</text>
  <text x="628" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[12] Sherlock</text>
  <text x="844" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[13] SQLMap</text>
  <text x="1040" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9c0b6">[Q] Exit</text>

  <rect x="0" y="297" width="1200" height="3" fill="#ff1a1a" opacity="0.25"/>
</svg>
