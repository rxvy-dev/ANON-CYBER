<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="50%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#8b0000">
        <animate attributeName="stop-color" values="#8b0000;#ff1a1a;#8b0000" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#4a1010"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="4" y="4" width="1192" height="252" rx="10"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="12" fill="url(#borderGlow)"/>
  <rect x="3" y="3" width="1194" height="254" rx="10" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- scanning sweep -->
    <rect x="-40" y="0" width="40" height="260" fill="#ff1a1a" opacity="0.06">
      <animate attributeName="x" values="-40;1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- faint scrolling terminal text in the background -->
    <text x="0" y="40" font-size="11" fill="#3a1414" letter-spacing="2">
      nmap -sV target &#8226; whois domain.com &#8226; subfinder -d example.com &#8226; nikto -host 10.0.0.1 &#8226;
      <animate attributeName="x" values="1200;-900" dur="18s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="235" font-size="11" fill="#3a1414" letter-spacing="2">
      sherlock user &#8226; holehe email@target.com &#8226; sqlmap --wizard &#8226; wpscan --url site.com &#8226;
      <animate attributeName="x" values="-900;1200" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- lightning bolt mark -->
    <path d="M 78 96 L 56 132 L 71 132 L 61 160 L 90 122 L 74 122 Z" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </path>

    <text x="108" y="120" font-size="52" font-weight="bold" fill="url(#accent)" filter="url(#glow)" letter-spacing="1">RXVY-RECON</text>
    <rect x="110" y="132" width="360" height="3" fill="url(#accent)">
      <animate attributeName="width" values="360;400;360" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="110" y="160" font-size="15" fill="#e6c9c9">One menu. Every recon tool you need.</text>
    <text x="110" y="182" font-size="12" fill="#7a3a3a">v3.0 &#8226; Open Source &#8226; ProxyChains-first</text>

    <g font-size="11" font-weight="bold">
      <rect x="110" y="196" width="86" height="22" rx="11" fill="#ff1a1a"/><text x="124" y="211" fill="#1a0000">15 TOOLS</text>
      <rect x="204" y="196" width="112" height="22" rx="11" fill="#c81e1e"/><text x="217" y="211" fill="#1a0000">PROXYCHAINS</text>
      <rect x="324" y="196" width="86" height="22" rx="11" fill="#8b0000" stroke="#ff4d4d" stroke-width="1"/><text x="338" y="211" fill="#f5c6c6">TOR+VPN</text>
    </g>

    <!-- pulsing status dot, top right -->
    <circle cx="1150" cy="40" r="6" fill="#ff1a1a">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="45" font-size="11" fill="#a34747" text-anchor="end" letter-spacing="2">LIVE MENU-DRIVEN CLI</text>

    <rect x="0" y="0" width="5" height="260" fill="url(#accent)"/>
  </g>
</svg>
